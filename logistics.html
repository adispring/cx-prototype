.pg-sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.pg-back { font-size: 13px; color: var(--muted); }
.pg-back:hover { color: var(--green-t); }
.pg-card { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 18px 20px; margin-bottom: 16px; }
.pg-card h3 { font-size: 15.5px; margin-bottom: 12px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 13px;
  font-size: 13.5px; font-family: inherit; background: #fff; color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); }
.field textarea { min-height: 92px; resize: vertical; }
.pg-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pg-note { font-size: 12.5px; color: var(--faint); }

.lg-card { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 22px 24px; margin-top: 14px; }
.lg-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.lg-top b { font-size: 15px; }
.lg-no { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.lg-badge { font-size: 12.5px; font-weight: 600; color: var(--green-t); background: var(--green-bg); padding: 5px 12px; border-radius: 999px; }
.tl { margin-top: 18px; }
.tl-step { position: relative; padding-left: 26px; padding-bottom: 22px; }
.tl-step::before { content: ""; position: absolute; left: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
.tl-step::after { content: ""; position: absolute; left: 8.5px; top: 16px; width: 1.5px; height: calc(100% - 16px); background: var(--line); }
.tl-step:last-child { padding-bottom: 0; }
.tl-step:last-child::after { display: none; }
.tl-step.done::before { background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
.tl-step.done .tl-d { color: var(--ink); font-weight: 600; }
.tl-d { font-size: 14px; color: var(--faint); }
.tl-t { font-size: 12px; color: var(--faint); margin-top: 4px; }
.lg-addr { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.8; }
.lg-addr b { color: var(--ink); }

<script>
function m(n) { return (n || 0).toLocaleString("en-US"); }
var id = new URLSearchParams(location.search).get("order");
var o = id ? window.Orders.get(id) : null;

if (!o) {
  document.getElementById("lgSub").textContent = "未找到订单";
  document.getElementById("lgCard").innerHTML = '<div class="pg-note">这个订单号不存在。<a class="ck-link" href="orders.html">回到订单列表</a></div>';
} else {
  document.getElementById("lgSub").textContent = "订单 " + o.id + " · " + o.createdAt + " 下单";
  var ex = o.express;
  if (!ex) {
    document.getElementById("lgCard").innerHTML =
      '<div class="pg-note">该订单' + (o.status === "pending" ? "还未付款" : "尚未发货") + '，暂无物流轨迹。' +
      '<br><br><a class="btn btn-ghost sm" href="order-detail.html?order=' + o.id + '">查看订单详情</a></div>';
  } else {
    var steps = ex.steps.slice().reverse();
    document.getElementById("lgCard").innerHTML =
      '<div class="lg-top"><div><b>' + ex.company + '</b><div class="lg-no">运单号 ' + ex.no +
        ' · 共 ' + window.Orders.qty(o) + ' 件商品</div></div>' +
        '<span class="lg-badge">' + window.Orders.statusMeta(o.status).label + '</span></div>' +
      '<div class="tl">' + steps.map(function (s) {
        return '<div class="tl-step' + (s.done ? " done" : "") + '"><div class="tl-d">' + s.d +
          '</div><div class="tl-t">' + (s.t || "等待更新") + '</div></div>';
      }).join("") + '</div>' +
      '<div class="lg-addr">寄往 <b>' + (o.addr ? o.addr.name : "—") + '</b> ' + (o.addr ? o.addr.phone : "") +
        '<br>' + (o.addr ? o.addr.region + " " + o.addr.detail : "") + '</div>' +
      '<div style="margin-top:16px;display:flex;gap:10px"><a class="btn btn-ghost sm" href="order-detail.html?order=' + o.id +
        '">订单详情</a><a class="btn btn-ghost sm" href="aftersale.html?order=' + o.id + '">申请售后</a></div>';
  }
}
</script>
